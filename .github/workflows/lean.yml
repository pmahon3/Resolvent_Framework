# Verification gate for the Lean development.
#
# Why this exists: until 2026-08-21 `lakefile.toml` declared the library with no
# `globs`, so `lake build` compiled only the root module and 46 of 47 files went
# unchecked. A green build meant nothing, and `PredictiveState.lean` sat broken
# for months behind it. `globs` is set now; this makes the build actually gate.
#
# Two checks:
#   1. the whole library elaborates;
#   2. the real open-goal count does not grow (`sorries.py` separates `sorry` in
#      code from `sorry` discussed in docstring prose -- currently 1 and 29).
#
# The budget is 0 as of 2026-08-22: the development is sorry-free. The last
# open goal, `stone_observational_extension`, was not closed by porting
# Yosida-Hewitt -- it was FALSE as stated (Andersen-Jessen refutes it under
# `UpperDirected`) and became provable once the hypothesis was corrected to
# `SequentiallyUpperDirected`. Raising this budget again should be a deliberate,
# argued act, not a convenience.

name: lean

on:
  push:
  pull_request:
  workflow_dispatch:

# The rendered blueprint is published to GitHub Pages from `main` (see the
# `deploy` job). Pages allows one concurrent deployment; queue rather than
# cancel, so a run that already passed the gates still publishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build QuerySystem (elan + Mathlib cache + lake build)
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formalization/QuerySystem

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: sorry ratchet
        run: python formalization/tools/prover/sorries.py --max 0

      # Every blueprint \lean{...} must name a real declaration. Runs against
      # the committed blueprint/lean_decls, so CI needs no plasTeX or
      # leanblueprint -- only the Lean build above.
      - name: blueprint declarations resolve
        run: bash formalization/QuerySystem/blueprint/checkdecls.sh

      # lean_decls is GENERATED by blueprint-web.sh but COMMITTED, and the step
      # above reads the committed copy. So a blueprint edit is invisible to CI
      # until someone re-renders and commits -- checkdecls will happily report
      # "all N resolve" while ignoring entries added minutes earlier. Re-render
      # here and fail if the committed file is stale.
      #
      # The render is also the only thing that catches an undeclared LaTeX
      # environment. plasTeX treats one as a warning and exits 0, but it
      # attaches that environment's \label to the PRECEDING theorem, silently
      # deleting that theorem from the dependency graph. thm:aj-tower
      # (AndersenJessen.X_thick) was missing for exactly this reason;
      # blueprint-web.sh now hard-fails on it.
      - name: blueprint renders, and lean_decls is current
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq graphviz
          pip install --quiet leanblueprint
          cd formalization/QuerySystem
          cp blueprint/lean_decls /tmp/lean_decls.committed
          # Annotate a render crash. Only the staleness branch below used
          # `::error::`, so when the render itself died (it did, on every run
          # from 2026-08-23 to 2026-08-24: no POSIX kpsewhich, so plasTeX could
          # not resolve even web.tex) the job surfaced nothing but "Process
          # completed with exit code 1" and the cause had to be read out of the
          # raw log.
          bash blueprint-web.sh || {
            echo "::error::blueprint render failed -- see the plasTeX output above"
            exit 1
          }
          if ! diff -u /tmp/lean_decls.committed blueprint/lean_decls; then
            echo "::error::blueprint/lean_decls is stale -- run"
            echo "  formalization/QuerySystem/blueprint-web.sh and commit the result"
            exit 1
          fi

      # checkdecls only checks blueprint -> Lean, so a module the blueprint
      # never mentions is invisible to it. Diagonal.lean was formalized,
      # graduated and completely absent from the blueprint behind a green CI.
      # Ratcheted rather than absolute: most modules are legitimately outside
      # the blueprint's scope, so this fails only on NEW ones.
      - name: blueprint coverage ratchet
        run: python formalization/QuerySystem/blueprint/coverage.py

      # The three gates above cannot see an `axiom`. `lake build` accepts one,
      # sorries.py counts no `sorry` in one, and checkdecls only asserts the
      # NAME resolves -- so a node can sit under a `\leanok` proof block, pass
      # everything, and still rest on an unproved stub. That is exactly what
      # slab0_not_mem did until 2026-08-24, when it turned out its dependency
      # (the §3 normal form) had been formalized all along.
      #
      # `#print axioms` over every blueprint declaration is the discriminating
      # check: a declaration is closed iff its dependencies are a subset of
      # {propext, Classical.choice, Quot.sound}. The development is at 90/90
      # clean, so this gate is absolute rather than ratcheted. If a genuinely
      # cited axiom is added later (the CLAUDE.md rule allows them), this will
      # fail and the fix is an explicit allowlist in axiomcheck.sh -- not
      # deleting the gate.
      - name: blueprint declarations rest on standard axioms only
        run: bash formalization/QuerySystem/blueprint/axiomcheck.sh

      # formalization/staging/ is deliberately OUTSIDE the lake globs, so that
      # work in progress can carry `sorry` without breaking the ratchet. That
      # exemption must not become an exemption from compiling at all: this is
      # the exact shape of the bug that let PredictiveState.lean sit broken for
      # months behind a green build.
      #
      # So: compile every staging file, but do NOT sorry-gate it. `lake env
      # lean` reports a sorry as a warning and exits 0, which is the behaviour
      # wanted here -- a staging file may have sorries, it may not fail to
      # elaborate.
      - name: staging files still compile
        run: |
          cd formalization/QuerySystem
          shopt -s nullglob
          for f in ../staging/*.lean; do
            echo "--- $f"
            lake env lean "$f" || { echo "STAGING FAILED TO COMPILE: $f"; exit 1; }
          done

      # LAST, deliberately: every gate above must pass before the blueprint is
      # published. `blueprint/web/` is a build artefact (gitignored) -- it is
      # rendered fresh by the step above, never served from a committed copy,
      # so what Pages shows cannot drift from what CI checked.
      - name: package the rendered blueprint for Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: formalization/QuerySystem/blueprint/web

  # Publishes to https://pmahon3.github.io/Resolvent_Framework/
  #
  # One-time repo setup this needs: Settings -> Pages -> Build and deployment ->
  # Source = "GitHub Actions". Without it the deploy step fails with "Pages is
  # not enabled"; nothing else in the workflow is affected.
  #
  # `main` only: a blueprint published from a feature branch would advertise
  # unreviewed status tags as the project's public record.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Verification gate for the Lean development.
#
# Why this exists: until 2026-08-21 `lakefile.toml` declared the library with no
# `globs`, so `lake build` compiled only the root module and 46 of 47 files went
# unchecked. A green build meant nothing, and `PredictiveState.lean` sat broken
# for months behind it. `globs` is set now; this makes the build actually gate.
#
# Two checks:
#   1. the whole library elaborates;
#   2. the real open-goal count does not grow (`sorries.py` separates `sorry` in
#      code from `sorry` discussed in docstring prose -- currently 1 and 29).
#
# The budget is 0 as of 2026-08-22: the development is sorry-free. The last
# open goal, `stone_observational_extension`, was not closed by porting
# Yosida-Hewitt -- it was FALSE as stated (Andersen-Jessen refutes it under
# `UpperDirected`) and became provable once the hypothesis was corrected to
# `SequentiallyUpperDirected`. Raising this budget again should be a deliberate,
# argued act, not a convenience.

name: lean

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build QuerySystem (elan + Mathlib cache + lake build)
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formalization/QuerySystem

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: sorry ratchet
        run: python formalization/tools/prover/sorries.py --max 0

      # Every blueprint \lean{...} must name a real declaration. Runs against
      # the committed blueprint/lean_decls, so CI needs no plasTeX or
      # leanblueprint -- only the Lean build above.
      - name: blueprint declarations resolve
        run: bash formalization/QuerySystem/blueprint/checkdecls.sh

      # formalization/staging/ is deliberately OUTSIDE the lake globs, so that
      # work in progress can carry `sorry` without breaking the ratchet. That
      # exemption must not become an exemption from compiling at all: this is
      # the exact shape of the bug that let PredictiveState.lean sit broken for
      # months behind a green build.
      #
      # So: compile every staging file, but do NOT sorry-gate it. `lake env
      # lean` reports a sorry as a warning and exits 0, which is the behaviour
      # wanted here -- a staging file may have sorries, it may not fail to
      # elaborate.
      - name: staging files still compile
        run: |
          cd formalization/QuerySystem
          shopt -s nullglob
          for f in ../staging/*.lean; do
            echo "--- $f"
            lake env lean "$f" || { echo "STAGING FAILED TO COMPILE: $f"; exit 1; }
          done
